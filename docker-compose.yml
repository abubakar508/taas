version: "3.9"

services:
   postgres:
      image: postgres:16-alpine
      container_name: taas-postgres
      restart: unless-stopped
      environment:
         POSTGRES_USER: taas
         POSTGRES_PASSWORD: taas
         POSTGRES_DB: taas
      ports:
         - "5432:5432"
      volumes:
         - postgres_data:/var/lib/postgresql/data
         - ./migrations:/docker-entrypoint-initdb.d:ro
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U taas -d taas"]
         interval: 10s
         timeout: 5s
         retries: 5
         start_period: 20s

   api:
      build:
         context: .
         dockerfile: Dockerfile
      container_name: taas-api
      restart: unless-stopped
      depends_on:
         postgres:
            condition: service_healthy
      environment:
         APP_NAME: taas-api
         APP_ENV: production
         PORT: 8080
         DATABASE_URL: postgres://taas:taas@postgres:5432/taas?sslmode=disable
         HTTP_READ_TIMEOUT: 15s
         HTTP_WRITE_TIMEOUT: 15s
         HTTP_IDLE_TIMEOUT: 60s
         SHUTDOWN_TIMEOUT: 20s
         LOG_LEVEL: info
      ports:
         - "8080:8080"
      healthcheck:
         test:
            ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
         interval: 15s
         timeout: 5s
         retries: 5
         start_period: 20s

volumes:
   postgres_data:
